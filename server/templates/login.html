<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">
    <title>Log in — Attune</title>
</head>
<body class="auth-body">
    <div class="auth-card">
        <h1 class="auth-title">Attune</h1>
        <p class="auth-subtitle">Log in to your account</p>
        <form method="POST" action="" class="auth-form">
            {{ form.hidden_tag() }}
            {{ form.username(class_='auth-input', placeholder='Username') }}
            {{ form.password(class_='auth-input', placeholder='Password') }}
            {{ form.submit(class_='auth-submit') }}
        </form>
        <p class="auth-switch">Don't have an account? <a href="{{url_for('register')}}">Sign up</a></p>
    </div>
</body>
</html>
