<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">
    <title>My Tasks — Attune</title>
</head>
<body class="todo-body">

    <header class="dash-header">
        <a href="{{ url_for('dashboard') }}" class="dash-logo">Attune</a>
        <nav class="dash-nav">
            <a href="{{ url_for('dashboard') }}" class="dash-nav-link"><i class="fas fa-home"></i> Dashboard</a>
            <form action="{{ url_for('logout') }}" method="post" style="display:inline">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="logout-btn">Log out</button>
            </form>
        </nav>
    </header>

    <main class="todo-main">
        <h2 class="todo-title">My Tasks</h2>

        <form class="add-task-form" id="addTaskForm">
            <input type="text" class="add-task-input" id="taskTitle" placeholder="Add a new task..." required>
            <select class="priority-select" id="taskPriority">
                <option value="5">High priority</option>
                <option value="3" selected>Medium priority</option>
                <option value="1">Low priority</option>
            </select>
            <button type="submit" class="add-task-btn"><i class="fas fa-plus"></i> Add</button>
        </form>

        <div class="todo-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="done">Done</button>
        </div>

        <ul class="todo-task-list" id="taskList"></ul>
    </main>

    <script>
        const CSRF_TOKEN = "{{ csrf_token() }}";
    </script>
    <script src="/static/main.js"></script>
</body>
</html>
